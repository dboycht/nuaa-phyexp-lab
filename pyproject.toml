[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuaa-phyexp-lab"
dynamic = ["version"]
description = "南京航空航天大学物理实验中心数据研究与物理实验预约辅助工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dboycht" }]
keywords = ["nuaa", "physics-lab", "booking", "playwright", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "playwright>=1.40",
  "requests>=2.31",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
phyexp = "phyexp_lab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "phyexp_lab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
